<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pública — Painel Eleitoral DF 2026</title>

    <meta name="description" content="Agenda pública de compromissos confirmados e calendário oficial do TSE para as Eleições 2026.">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        window.SUPABASE_URL = "%VITE_SUPABASE_URL%";
        window.SUPABASE_ANON_KEY = "%VITE_SUPABASE_ANON_KEY%";
    </script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="components.css">
    <style>
        body { background: var(--bg-body, #f4f2ec); }
        .page-shell { max-width: 900px; margin: 0 auto; padding: 24px 24px 64px; }
        .page-shell h1 { font-size: 1.4rem; margin: 0 0 20px; color: var(--primary, #1F4E78); }
    </style>
</head>
<body>
    <div class="page-shell">
        <h1>🗓️ Agenda do Candidato</h1>

        <div class="okr-section">
            <h3>📢 Compromissos Confirmados</h3>
            <div id="agenda-publica-container" class="okr-cards-grid">
                <div class="instruction">Carregando…</div>
            </div>
        </div>

        <div class="okr-section" style="margin-top: 30px;">
            <h3>⚖️ Calendário Oficial do TSE — Prazos até a Eleição</h3>
            <p class="instruction" style="font-size: 0.85rem;">Fonte: Resolução TSE nº 23.760/2026. Passe o mouse sobre uma linha para ver a descrição completa do prazo.</p>
            <div class="table-container">
                <table id="prazos-tse-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Prazo</th>
                            <th>Categoria</th>
                        </tr>
                    </thead>
                    <tbody id="prazos-tse-tbody">
                        <tr><td colspan="3" class="instruction">Carregando…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
    <script src="toast.js"></script>
    <script src="agenda-component.js"></script>
    <script src="agenda.js"></script>
</body>
</html>
