<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in — Painel Eleitoral DF 2026</title>
    <meta name="robots" content="noindex, nofollow">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        window.SUPABASE_URL = "%VITE_SUPABASE_URL%";
        window.SUPABASE_ANON_KEY = "%VITE_SUPABASE_ANON_KEY%";
    </script>

    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f4f2ec; }
        .page-shell { max-width: 480px; margin: 0 auto; padding: 18px 16px 64px; }
        .page-topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
        .page-topbar h1 { font-size: 1.2rem; margin: 0; color: var(--primary, #1F4E78); }
        .page-user { font-size: 0.8rem; color: #5B6360; text-align: right; }
        .page-signout { margin-top: 6px; padding: 4px 10px; font-size: 0.78rem; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; }
        .okr-card .btn-primary { width: 100%; margin-top: 10px; padding: 12px; font-size: 1rem; }
    </style>
</head>
<body>
    <div id="page-loading" class="page-shell">Verificando acesso…</div>

    <div id="page-content" class="page-shell" style="display:none">
        <div class="page-topbar">
            <h1>📍 Check-in</h1>
            <div class="page-user">
                <div id="page-user-name"></div>
                <button id="page-signout" class="page-signout">Sair</button>
            </div>
        </div>

        <div class="okr-section" id="checkin-progresso-section" style="display: none;">
            <h3 style="font-size:1rem;">📊 Progresso da sua Coordenação</h3>
            <div id="checkin-progresso-container" class="okr-cards-grid"></div>
        </div>

        <div class="okr-section" id="checkin-quadrantes-section" style="margin-top: 24px; display: none;">
            <h3 style="font-size:1rem;">🗺️ Meu(s) Quadrante(s)</h3>
            <div id="checkin-quadrantes-container" class="okr-cards-grid"></div>
        </div>

        <div class="okr-section" id="checkin-historico-section" style="margin-top: 24px; display: none;">
            <h3 style="font-size:1rem;">📋 Meus Check-ins</h3>
            <div id="checkin-historico-container" class="okr-cards-grid"></div>
        </div>
    </div>

    <script src="okr-shared.js"></script>
    <script src="voluntario.js"></script>
    <script type="module">
        import { guardPage, signOut } from './auth-shared.js';

        async function init() {
            const result = await guardPage({ allowedRoles: ['voluntario'] });
            if (!result) return;

            document.getElementById('page-loading').style.display = 'none';
            document.getElementById('page-content').style.display = '';
            document.getElementById('page-user-name').textContent = result.ctx.profile.full_name || result.ctx.profile.email;
            document.getElementById('page-signout').addEventListener('click', async () => {
                await signOut(result.sb);
                window.location.href = 'login.html';
            });

            await window.initVoluntarioPage(result.sb, result.ctx);
        }

        init();
    </script>
</body>
</html>
