<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Comando — Painel Eleitoral DF 2026</title>
    <meta name="robots" content="noindex, nofollow">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        window.SUPABASE_URL = "%VITE_SUPABASE_URL%";
        window.SUPABASE_ANON_KEY = "%VITE_SUPABASE_ANON_KEY%";
    </script>

    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f4f2ec; }
        .page-shell { max-width: 1200px; margin: 0 auto; padding: 24px 24px 64px; }
        .page-topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; }
        .page-topbar h1 { font-size: 1.4rem; margin: 0; color: var(--primary, #1F4E78); }
        .page-user { font-size: 0.85rem; color: #5B6360; text-align: right; }
        .page-signout { margin-top: 6px; padding: 4px 10px; font-size: 0.78rem; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div id="page-loading" class="page-shell">Verificando acesso…</div>

    <div id="page-content" class="page-shell" style="display:none">
        <div class="page-topbar">
            <h1>🧭 Central de Comando</h1>
            <div class="page-user">
                <div id="page-user-name"></div>
                <button id="page-signout" class="page-signout">Sair</button>
            </div>
        </div>

        <div class="comando-kpis">
            <div class="comando-kpi-card" id="comando-kpi-semaforo"></div>
            <div class="comando-kpi-card" id="comando-kpi-cobertura"></div>
            <div class="comando-kpi-card" id="comando-kpi-lider"></div>
            <div class="comando-kpi-card" id="comando-kpi-prazo"></div>
        </div>

        <div class="comando-grid">
            <div class="comando-panel">
                <h3>📊 OKRs Estratégicos</h3>
                <div id="comando-semaforo-container"></div>
            </div>
            <div class="comando-panel">
                <h3>🗺️ Cobertura Territorial</h3>
                <div id="comando-cobertura-container"></div>
            </div>
            <div class="comando-panel">
                <h3>🏆 Ranking de Coordenações</h3>
                <div id="comando-ranking-container"></div>
            </div>
        </div>

        <div class="comando-panel comando-radar">
            <div>
                <h3>⏳ Próximo Prazo do TSE</h3>
                <div id="comando-radar-prazo"></div>
            </div>
            <div>
                <h3>🗓️ Agenda dos Próximos 3 Dias</h3>
                <div id="comando-radar-agenda"></div>
            </div>
        </div>

        <div class="okr-section" style="margin-top: 30px;">
            <div class="okr-header-actions">
                <h2>👥 Equipe</h2>
                <div class="okr-btn-group">
                    <button class="btn-primary" onclick="openNewEquipeModal()">👥 Adicionar à Equipe</button>
                </div>
            </div>
            <div id="equipe-list-container" class="equipe-cards-grid"></div>
        </div>

        <div class="okr-section" style="margin-top: 30px;">
            <div class="okr-header-actions">
                <h2>🗓️ Agenda — Aprovação</h2>
                <div class="okr-btn-group" id="agenda-btn-group"></div>
            </div>
            <div id="agenda-pendentes-section" style="display: none;">
                <h3>⏳ Solicitações Pendentes de Aprovação</h3>
                <div id="agenda-pendentes-container" class="okr-cards-grid"></div>
            </div>
        </div>
    </div>

    <script src="okr-shared.js"></script>
    <script src="admin.js"></script>
    <script type="module">
        import { guardPage, signOut } from './auth-shared.js';

        async function init() {
            const result = await guardPage({ allowedRoles: ['superAdmin'] });
            if (!result) return;

            document.getElementById('page-loading').style.display = 'none';
            document.getElementById('page-content').style.display = '';
            document.getElementById('page-user-name').textContent = result.ctx.profile.full_name || result.ctx.profile.email;
            document.getElementById('page-signout').addEventListener('click', async () => {
                await signOut(result.sb);
                window.location.href = 'login.html';
            });

            await window.initAdminPage(result.sb, result.ctx);
        }

        init();
    </script>
</body>
</html>
