<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKRs — Painel Eleitoral DF 2026</title>
    <meta name="robots" content="noindex, nofollow">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        window.SUPABASE_URL = "%VITE_SUPABASE_URL%";
        window.SUPABASE_ANON_KEY = "%VITE_SUPABASE_ANON_KEY%";
    </script>

    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f4f2ec; }
        .page-shell { max-width: 1200px; margin: 0 auto; padding: 24px 24px 64px; }
        .page-topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; }
        .page-topbar h1 { font-size: 1.4rem; margin: 0; color: var(--primary, #1F4E78); }
        .page-user { font-size: 0.85rem; color: #5B6360; text-align: right; }
        .page-signout { margin-top: 6px; padding: 4px 10px; font-size: 0.78rem; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div id="page-loading" class="page-shell">Verificando acesso…</div>

    <div id="page-content" class="page-shell" style="display:none">
        <div class="page-topbar">
            <h1>🎯 Gestão de OKRs &amp; Coordenações Regionais</h1>
            <div class="page-user">
                <div id="page-user-name"></div>
                <button id="page-signout" class="page-signout">Sair</button>
            </div>
        </div>

        <div class="okr-btn-group" id="okr-btn-group"></div>

        <div class="okr-level-filters" style="margin: 14px 0;">
            <p class="poi-layers-title">Filtrar por Nível</p>
            <button class="btn-filter-level active" data-level="all" onclick="filterOKRLevel('all')">Todos</button>
            <button class="btn-filter-level" data-level="estrategico" onclick="filterOKRLevel('estrategico')">⭐ Estratégico</button>
            <button class="btn-filter-level" data-level="tatico" onclick="filterOKRLevel('tatico')">📌 Tático</button>
            <button class="btn-filter-level" data-level="operacional" onclick="filterOKRLevel('operacional')">👥 Operacional</button>
        </div>

        <div class="okr-period-bar">
            <label for="okr-period-select">Ciclo:</label>
            <select id="okr-period-select" onchange="changeOKRPeriod(this.value)"></select>
        </div>

        <div class="okr-section">
            <h3>⭐ Nível Estratégico &amp; Tático (Objetivos e Resultados-Chave)</h3>
            <div id="okr-list-container" class="okr-cards-grid"></div>
        </div>

        <div class="okr-section" style="margin-top: 30px;">
            <h3>📄 Artefatos &amp; Comprovantes Digitalizados de Campo</h3>
            <div id="artefatos-list-container" class="artefatos-cards-grid"></div>
        </div>
    </div>

    <script src="okr-shared.js"></script>
    <script src="okrs.js"></script>
    <script type="module">
        import { guardPage, signOut } from './auth-shared.js';

        async function init() {
            const result = await guardPage({ allowedRoles: ['superAdmin', 'coordenador'] });
            if (!result) return;

            document.getElementById('page-loading').style.display = 'none';
            document.getElementById('page-content').style.display = '';
            document.getElementById('page-user-name').textContent = result.ctx.profile.full_name || result.ctx.profile.email;
            document.getElementById('page-signout').addEventListener('click', async () => {
                await signOut(result.sb);
                window.location.href = 'login.html';
            });

            await window.initOkrsPage(result.sb, result.ctx);
        }

        init();
    </script>
</body>
</html>
